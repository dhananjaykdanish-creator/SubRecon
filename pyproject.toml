[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subrecon"
version = "0.1.0"
description = "Advanced Subdomain Reconnaissance & Website Asset Discovery Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["subrecon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[project.scripts]
subrecon = "subrecon.cli:app"

[tool.setuptools.package-data]
"subrecon.storage" = ["migrations/*.sql"]
